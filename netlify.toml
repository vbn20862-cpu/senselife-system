# Netlify CI 設定 — 綁 GitHub 後 push main 即自動建置部署
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_ 開頭的變數本來就會打進前端 bundle（Google Calendar 瀏覽器金鑰，靠 referer 限制），
  # 跳過 Netlify secrets scanning 對這兩把的檢查，否則雲端建置會被擋（2026-10-16 升級 Pro 後首次發生）
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_CALENDAR_API_KEY,VITE_GOOGLE_CALENDAR_ID"

# 排程函式（netlify/functions/）：monthly-drafts 每月 5 號產生薪資明細草稿；用 esbuild 打包以解析 src/utils 的無副檔名 import
[functions]
  node_bundler = "esbuild"

# SPA fallback：所有路徑交給 React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
